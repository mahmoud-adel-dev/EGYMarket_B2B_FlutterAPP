# =============================================================================
# SEALS production stack
#   web    — Flutter Web (SPA) served by nginx
#   api    — Next.js API + Admin dashboard (MongoDB Atlas / Cloudinary / SMTP are external)
#   caddy  — HTTPS termination, reverse proxy, security headers
#
# Configure via the root .env.production file (copy .env.production.example).
# =============================================================================

services:
  web:
    build:
      context: ./app
      args:
        API_BASE_URL_PROD: ${WEB_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - seals

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - seals

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - seals

networks:
  seals:

volumes:
  caddy_data:
  caddy_config:
