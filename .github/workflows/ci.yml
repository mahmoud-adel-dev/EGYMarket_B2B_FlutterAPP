name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Dependency security audit (high+)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/seals_ci
          NEXTAUTH_SECRET: ci-only-secret-that-is-not-used-in-production-and-is-long-enough
          NEXTAUTH_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:8080

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - run: cp .env.example .env
      - run: flutter analyze
      - run: flutter test
      - name: Release web build (production artifact)
        run: flutter build web --release
        env:
          API_BASE_URL_PROD: https://api.example.com/api

  docker:
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare CI-only runtime environment
        run: cp backend/.env.production.example backend/.env.production
      - name: Validate compose configuration
        run: docker compose config -q
        env:
          APP_DOMAIN: app.example.com
          API_DOMAIN: api.example.com
          WEB_API_BASE_URL: https://api.example.com/api
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build Flutter Web image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          build-args: |
            API_BASE_URL_PROD=https://api.example.com/api
