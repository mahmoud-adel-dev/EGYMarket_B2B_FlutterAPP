# SEALS Flutter Web SPA server.
# - Hashed build assets are immutable → cache aggressively.
# - index.html is never cached hard so deployments reach users immediately.
# - SPA fallback routes unknown paths to index.html for client-side routing.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Lightweight liveness endpoint for Docker healthchecks.
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Flutter build output is content-hashed → safe to cache forever.
  location ~* \.(js|css|wasm|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry point aggressively; revalidate each deployment.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # SPA fallback for deep links (/products/123, /orders, ...).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
